# AIM4ML — mypy configuration
#
# Top-level lib/ (identity-neutral, D70) and the curation tracks are checked
# from the repo root in one run:
#
#   MYPYPATH=. .venv/bin/mypy -p lib -p curation.graph -p curation.common
#
# selection/lib is still checked separately — it exposes an importable top-level
# "lib" (via script-local sys.path bootstraps), and mypy errors on the duplicate
# module name:
#
#   MYPYPATH=selection .venv/bin/mypy -p lib

[mypy]
pretty = True
show_error_codes = True

# pyarrow ships no stubs/py.typed; RDKit 2026+ does. tqdm ships no stubs.
[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True
