# AIM4ML — mypy configuration
#
# Both pipeline packages expose an importable top-level "lib"
# (curation/lib, selection/lib) via script-local sys.path bootstraps,
# so each is checked separately from the repo root:
#
#   MYPYPATH=curation  .venv/bin/mypy -p lib
#   MYPYPATH=selection .venv/bin/mypy -p lib
#
# (Do NOT list both in one run — mypy errors on the duplicate module name.)

[mypy]
pretty = True
show_error_codes = True

# pyarrow ships no stubs/py.typed; RDKit 2026+ does.
[mypy-pyarrow.*]
ignore_missing_imports = True
